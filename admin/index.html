<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
  <!--
    The CMS config lives in cms-config.yml (this link tells Decap where it is).
    It was renamed while the site was on Porkbun, which refused any file named
    config.yml; the name is kept because nothing depends on the old one.
  -->
  <link href="/admin/cms-config.yml" type="text/yaml" rel="cms-config-url" />
</head>
<body>
  <!--
    Decap CMS 3.10.1 is a single 5.1MB file. On Porkbun (until 2026-11-08) the
    local copy could not be served, so it loads from a CDN, pinned by an
    integrity hash of the vendored copy: a CDN can only serve that exact file
    or nothing. The local copy is the fallback, and on Vercel it serves fine.
  -->
  <script>
    (function () {
      var integrity = 'sha384-cfeDbz01Pc3d/tDdxwcLyYE9bmTuSm9oSEkaqblVTYBG0eQ3a6koW/K3wUGSd/lG';
      var sources = [
        { src: 'https://cdn.jsdelivr.net/npm/decap-cms@3.10.1/dist/decap-cms.js', integrity: integrity },
        { src: 'https://unpkg.com/decap-cms@3.10.1/dist/decap-cms.js', integrity: integrity },
        { src: '/static/vendor/decap-cms/decap-cms.js' }
      ];
      function load(index) {
        if (index >= sources.length) {
          document.body.insertAdjacentHTML('beforeend',
            '<p style="font:16px system-ui;padding:2rem">The content manager could not load. ' +
            'Check your connection, or that cdn.jsdelivr.net and unpkg.com are not blocked.</p>');
          return;
        }
        var script = document.createElement('script');
        script.src = sources[index].src;
        if (sources[index].integrity) {
          script.integrity = sources[index].integrity;
          script.crossOrigin = 'anonymous';
        }
        script.onerror = function () { load(index + 1); };
        document.body.appendChild(script);
      }
      load(0);
    })();
  </script>
</body>
</html>
