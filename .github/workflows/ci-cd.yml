name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check committed production CSS
        run: git diff --exit-code -- css/utilities.css
      - name: Upload reviewed static site
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: dist/
